version: 2
updates:
  # Rust dependencies (Cargo.toml / Cargo.lock).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 99
    commit-message:
      prefix: "deps(rust)"
    labels: ["dependencies", "rust"]
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["patch", "minor", "major"]

  # Fuzz targets — their own manifest, deliberately outside any workspace so
  # cargo-fuzz's nightly/sanitizer flags stay off the main build.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: daily
    open-pull-requests-limit: 99
    commit-message:
      prefix: "deps(fuzz)"
    labels: ["dependencies", "rust"]
    groups:
      fuzz:
        patterns: ["*"]
        update-types: ["patch", "minor", "major"]

  # GitHub Actions workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 99
    commit-message:
      prefix: "deps(actions)"
    labels: ["dependencies", "actions"]
    groups:
      actions:
        patterns: ["*"]
